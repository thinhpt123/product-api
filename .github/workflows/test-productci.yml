name: 1. CI Basic (Test Build)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: "Job: Check Node & Install"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      - name: Install dependencies
        run: npm install