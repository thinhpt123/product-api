name: CI Pipeline for Prod

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      - run: npm install

      - name: Run server and test connection
        env:
          MONGO_URI: mongodb://localhost:27017/productdb
          PORT: 3000
        run: |
          node server.js &
          sleep 5
          curl -f http://localhost:3000/api/products || exit 1