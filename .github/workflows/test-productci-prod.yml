deploy:
    needs: test # CHỈ CHẠY DEPLOY KHI JOB 'TEST' BÊN TRÊN THÀNH CÔNG
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    # Đăng nhập vào tài khoản Docker Hub của bạn bằng Secret
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    # Build Image và Push lên Docker Hub
    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        # Đặt tên Tag image chuẩn, ví dụ: nam/product-api:latest
        tags: ${{ secrets.DOCKER_USERNAME }}/product-api:latest