name: 2. Full CI/CD Pipeline (Test & Deploy)

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    name: "Phase 1: CI (Test MongoDB & API)"
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      - run: npm install

      - name: Run server and test connection
        env:
          MONGO_URI: mongodb://localhost:27017/productdb
          PORT: 3000
        run: |
          node server.js &
          sleep 5
          curl -f http://localhost:3000/api/products || exit 1

  deploy:
    name: "Phase 2: CD (Build & Push Docker Hub)"
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/product-api:latest