version: '3.8'
services:
  # --- DỊCH VỤ 1: MONGODB ---
  mongodb:
    image: mongo:latest
    container_name: nammongodb
    ports:
      - "27017:27017" # Map cổng máy thật : cổng container
    healthcheck:
      # Lệnh kiểm tra: Bắn 1 lệnh ping đến cơ sở dữ liệu MongoDB
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s # Cứ 10 giây kiểm tra 1 lần
      timeout: 5s   # Quá 5 giây không phản hồi thì tính là lỗi 1 lần
      retries: 5    # Thử lại tối đa 5 lần trước khi báo Unhealthy

  # --- DỊCH VỤ 2: PRODUCT API ---
  api:
    build: . # Tự động build Dockerfile ở thư mục hiện tại
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      # Chú ý: Host đổi từ 'localhost' thành tên service 'mongodb'
      - MONGO_URI=mongodb://mongodb:27017/productdb
    depends_on:
      mongodb:
        # Chỉ khởi động API khi dịch vụ MongoDB đạt trạng thái HEALTHY
        condition: service_healthy
    healthcheck:
      # Kiểm tra API bằng cách gọi thử đường dẫn HTTP GET /api/products
      test: wget --no-verbose --tries=1 --spider http://localhost:3000/api/products || exit 1
      interval: 10s
      timeout: 5s
      retries: 3