
services:
  mongodb:
    image: mongo:latest
    container_name: nammongodb_prod

  api:
    # Lấy Image từ Docker Hub thay vì dùng lệnh 'build: .' từ source code
    image: thinhiuh/product-api:latest
    ports:
      - "80:3000" # Mở cổng 80 (cổng web chuẩn) ra ngoài
    environment:
      - PORT=${PORT}
      - MONGO_URI=${MONGO_URI}
    depends_on:
      - mongodb