version: '3.8'
services:
  mongodb:
    image: mongo:latest
    container_name: nammongodb_prod

  api:
    # Lấy Image từ Docker Hub thay vì dùng lệnh 'build: .' từ source code
    image: <tuyen-tai-khoan-docker-hub>/product-api:latest
    ports:
      - "80:3000" # Mở cổng 80 (cổng web chuẩn) ra ngoài
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/productdb
    depends_on:
      - mongodb